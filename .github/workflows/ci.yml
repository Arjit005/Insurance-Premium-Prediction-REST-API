name: AI Quality & CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Run Quality Gates & Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest httpx

      - name: Verify Model SHA-256 Checksum
        run: |
          python -c "from ML_model.predict import _verify_model_integrity, MODEL_PATH, CHECKSUM_PATH; _verify_model_integrity(MODEL_PATH, CHECKSUM_PATH); print('Model checksum verified!')"

      - name: Run Pytest Suite
        run: |
          pytest -v --durations=10 tests/
